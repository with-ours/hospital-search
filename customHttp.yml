customHeaders:
  - pattern: '**'
    headers:
      - key: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://cdn.oursprivacy.com https://dev-cdn.oursprivacy.com; font-src 'self' data:; connect-src 'self' blob: data: https://cdn.oursprivacy.com https://dev-cdn.oursprivacy.com; worker-src 'self' blob:; child-src 'self' blob:; media-src 'self' blob:; frame-src 'self'"
      - key: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains; preload"
      - key: X-Frame-Options
        value: "DENY"
      - key: X-Content-Type-Options
        value: "nosniff"
      - key: Referrer-Policy
        value: "strict-origin-when-cross-origin"
